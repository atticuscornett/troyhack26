<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PDF Highlight Review</title>

  <link rel="stylesheet" href="styles.css?v=highlights-9">
</head>

<body>
  <main class="app">

    <!-- LEFT PANEL -->
    <aside id="filePanel">
      <h2>Files</h2>
      <div id="fileList"></div>

      <!-- IMPORT FILE -->
     <div id="importMessage"></div>

     <button id="importButton" type="button">
      Import Files
    </button>
  </aside>

    <!-- CENTER PDF PANEL -->
    <section id="pdfPanel">
      <h1 id="docTitle">Document Title</h1>
      <div id="pdfContainer"></div>
    </section>

    <!-- RIGHT HIGHLIGHTS PANEL -->
    <aside id="detailsPanel">
      <h2>Highlights</h2>
      <div id="highlightDetails"></div>
      <div id="reviewActions">
        <button id="acceptButton" type="button" data-review-status="accepted" disabled>Accept</button>
        <button id="rejectButton" type="button" data-review-status="denied" disabled>Reject</button>
      </div>
    </aside>

  </main>

  <script type="text/javascript" src="/eel.js"></script>

  <script src="app.js?v=highlights-8"></script>
</body>

</html>
